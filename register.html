<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f4f6">
  <meta name="description" content="Buat akun KARSA POS untuk mengelola operasional usaha Anda.">
  <title>KARSA POS | Sistem Kasir</title>
  <link rel="icon" type="image/png" href="./assets/karsa-pos-logo.png.png">
  <link rel="apple-touch-icon" href="./assets/karsa-pos-logo.png.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="auth-page">
  <main class="auth-card register-card">
    <header class="auth-heading">
      <img class="auth-logo" src="./assets/karsa-pos-logo.png.png" alt="KARSA POS">
      <h1 id="registrationTitle">Buat akun baru</h1>
      <p id="registrationSubtitle">Mulai kelola usaha Anda dengan mudah.</p>
    </header>

    <button id="google-register-button" class="auth-google-button" type="button">
      <svg aria-hidden="true" viewBox="0 0 48 48" width="20" height="20"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.91c-.58 2.96-2.26 5.48-4.76 7.18l7.73 6C44.39 37.75 46.98 31.67 46.98 24.55Z"/><path fill="#FBBC05" d="M10.53 28.59a14.45 14.45 0 0 1 0-9.18l-7.98-6.19a23.9 23.9 0 0 0 0 21.56l7.98-6.19Z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.73-6c-2.15 1.45-4.9 2.3-8.17 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"/></svg>
      Daftar dengan Google
    </button>
    <div class="auth-divider"><span>atau daftar dengan email</span></div>

    <form id="registerForm" novalidate>
      <div class="register-grid">
        <div class="register-field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"></div>
        <div class="register-field"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required minlength="3" maxlength="50"></div>
        <div class="register-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8"></div>
        <div class="register-field"><label for="confirmPassword">Konfirmasi password</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8"></div>
        <div class="register-field owner-field"><label for="nama_toko">Nama toko</label><input id="nama_toko" name="nama_toko" required maxlength="120"></div>
        <div class="register-field owner-field"><label for="nama_pemilik">Nama pemilik</label><input id="nama_pemilik" name="nama_pemilik" autocomplete="name" required maxlength="120"></div>
        <div class="register-field full owner-field"><label for="alamat">Alamat toko</label><input id="alamat" name="alamat" autocomplete="street-address" required maxlength="300"></div>
        <div class="register-field full owner-field"><label for="telepon">Nomor telepon</label><input id="telepon" name="telepon" type="tel" autocomplete="tel" required maxlength="30"></div>
      </div>
      <div id="formMessage" role="status" aria-live="polite" hidden></div>
      <button id="submitButton" class="auth-submit-button" type="submit">Daftar Sekarang</button>
    </form>
    <p class="auth-switch-link">Sudah punya akun? <a href="./index.html?login=1">Masuk ke KARSA POS</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./register.js"></script>
</body>
</html>
